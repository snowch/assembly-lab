# Copyright © 2026 Christopher Snow
name: Style preview
on:
  push:
    branches: [preview/shared-course-style]
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:style-preview
      - run: npm run test:style-preview
      - name: Comparison index
        if: always()
        run: node scripts/style-preview-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-preview-comparisons
          path: style-preview-results
          retention-days: 7
          compression-level: 0
