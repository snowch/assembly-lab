name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Dependencies, exactly as the lockfile says
        run: npm ci

      - name: Playwright's Chromium, for the educational tests
        # The npm package is pinned in package.json; this fetches the browser build it expects.
        run: npx playwright install --with-deps chromium

      - name: Everything, exactly as `npm run check` runs it
        env:
          CI: "true"
        run: ./scripts/check.sh

  # The differential test needs the real tools, so it is its own job and not part of
  # scripts/check.sh. It holds the simulator and the assembler to GNU as and QEMU.
  real-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: GNU as and ld for A64, and QEMU's user mode
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user binutils-aarch64-linux-gnu

      - name: Dependencies, exactly as the lockfile says
        run: npm ci

      - name: The simulator and the assembler against the real tools
        run: npm run check:real-tools

  native-lessons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native ARM64 lesson tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user gdb-multiarch qemu-system-arm file python3
      - name: Executables, debugger stops, challenges and optional UART
        run: python3 scripts/native/check.py
